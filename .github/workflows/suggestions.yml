name: Suggestion board
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, milestoned, demilestoned]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: suggestion-board
  cancel-in-progress: false
jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/suggestions-board.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit SUGGESTIONS.md
        run: |
          if git diff --quiet -- SUGGESTIONS.md && git ls-files --error-unmatch SUGGESTIONS.md >/dev/null 2>&1; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SUGGESTIONS.md
          git commit -m "Update suggestion board"
          git push
